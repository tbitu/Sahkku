[defaults]
base_branch = "main"

[validation]
required = ["build"]
meta_review_approve_required = ["test"]

[validation.commands]
build = "dotnet build Tools/RulesTests/RulesTests.csproj"
test = "dotnet test Tools/RulesTests/RulesTests.csproj"
bootstrap = "dotnet restore Tools/RulesTests/RulesTests.csproj"

[defaults.agents]
reviewer = "opencode"
reviewer_model = "lmstudio/pairflow-reviewer"
implementer = "reasonix"
#implementer_model = "lmstudio/pairflow-implementer"
meta_reviewer = "opencode"
meta_reviewer_model = "lmstudio/pairflow-meta-reviewer"

[defaults.watchdog_timeout_minutes_by_agent]
opencode = 120
reasonix = 30

[plan_watch.runner]
backend = "opencode"
idle_timeout_seconds = 1800
