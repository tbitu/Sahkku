[defaults]
base_branch = "main"

[validation]
required = ["build"]
meta_review_approve_required = ["test"]

[validation.commands]
build = "npm run build"
test = "npm test"
bootstrap = "npm install"

[defaults.agents]
reviewer = "reasonix"
reviewer_model = "deepseek-flash"
implementer = "reasonix"
implementer_model = "deepseek-flash"
meta_reviewer = "opencode"
meta_reviewer_model = "lmstudio/pairflow-meta-reviewer"

[defaults.watchdog_timeout_minutes_by_agent]
opencode = 120
reasonix = 30

[plan_watch.runner]
backend = "opencode"
idle_timeout_seconds = 1800
