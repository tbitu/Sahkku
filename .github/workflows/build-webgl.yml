name: Build and Release WebGL

on:
  push:
    branches:
      - main
    paths:
      - 'Sahkku/**'
      - '.github/workflows/build-webgl.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Swap Space
        run: |
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Restore / Cache Library
        uses: actions/cache@v4
        with:
          path: Sahkku/Library
          key: Library-${{ hashFiles('Sahkku/Assets/**', 'Sahkku/Packages/**', 'Sahkku/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Build WebGL Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Sahkku
          targetPlatform: WebGL
          buildMethod: Sahkku.Editor.BuildWebGL.BuildFromCommandLine
          buildsPath: build

      - name: Package WebGL
        run: |
          # Package the WebGL output folder into a tarball
          tar -czf sahkku-webgl.tar.gz -C build/WebGL/WebGL .

      - name: Publish WebGL Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: webgl-latest
          name: "Latest WebGL Build"
          body: "Automated WebGL build from commit ${{ github.sha }}"
          files: sahkku-webgl.tar.gz
          draft: false
          prerelease: false
          make_latest: true
