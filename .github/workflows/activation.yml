name: Acquire Unity Activation File

on:
  workflow_dispatch: {}

jobs:
  activation:
    name: Request manual activation file (.alf)
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: get-activation-file
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityActivationFile
          path: ${{ steps.get-activation-file.outputs.filePath }}
